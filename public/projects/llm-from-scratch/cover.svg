<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="LLM from Scratch build pipeline: seven stages, two shipped, stage three in progress">
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#8052ff" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#8052ff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#8052ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8052ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#8052ff" stop-opacity="0.55" />
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 L0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#050505" />
  <rect width="1600" height="1000" fill="url(#grid)" />
  <rect width="1600" height="1000" fill="url(#glow)" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="160" y="150" fill="#ffb829" font-size="22" letter-spacing="6">IN PROGRESS - 2026</text>

    <text x="156" y="256" fill="#ffffff" font-size="96" font-weight="600" letter-spacing="-1">LLM FROM SCRATCH</text>

    <text x="160" y="320" fill="#9a9a9a" font-size="26" letter-spacing="0.5">A generative language model built from first principles -</text>
    <text x="160" y="358" fill="#9a9a9a" font-size="26" letter-spacing="0.5">no high-level model libraries, every tensor shape tracked.</text>

    <!-- pipeline rail -->
    <line x1="176" y1="640" x2="1424" y2="640" stroke="#1f1f1f" stroke-width="2" />
    <line x1="176" y1="640" x2="592" y2="640" stroke="url(#lit)" stroke-width="2" />

    <!-- stage 1 - shipped -->
    <circle cx="176" cy="640" r="26" fill="#8052ff" fill-opacity="0.18" stroke="#8052ff" stroke-width="2" />
    <path d="M166 640 l7 8 13 -16" fill="none" stroke="#c9b6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- stage 2 - shipped -->
    <circle cx="384" cy="640" r="26" fill="#8052ff" fill-opacity="0.18" stroke="#8052ff" stroke-width="2" />
    <path d="M374 640 l7 8 13 -16" fill="none" stroke="#c9b6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- stage 3 - in progress -->
    <circle cx="592" cy="640" r="34" fill="none" stroke="#ffb829" stroke-opacity="0.35" stroke-width="1.5" />
    <circle cx="592" cy="640" r="26" fill="#ffb829" fill-opacity="0.12" stroke="#ffb829" stroke-width="2" />
    <circle cx="592" cy="640" r="7" fill="#ffb829" />

    <!-- stage 4..7 - planned -->
    <circle cx="800" cy="640" r="26" fill="#0b0b0b" stroke="#2c2c2c" stroke-width="2" />
    <circle cx="1008" cy="640" r="26" fill="#0b0b0b" stroke="#2c2c2c" stroke-width="2" />
    <circle cx="1216" cy="640" r="26" fill="#0b0b0b" stroke="#2c2c2c" stroke-width="2" />
    <circle cx="1424" cy="640" r="26" fill="#0b0b0b" stroke="#2c2c2c" stroke-width="2" />

    <!-- stage labels -->
    <g font-size="17" letter-spacing="3" text-anchor="middle">
      <text x="176" y="712" fill="#c9c9c9">TOKENIZER</text>
      <text x="384" y="712" fill="#c9c9c9">DATA LOAD</text>
      <text x="592" y="712" fill="#ffb829">BIGRAM</text>
      <text x="800" y="712" fill="#6d6d6d">ATTENTION</text>
      <text x="1008" y="712" fill="#6d6d6d">TRANSFORMER</text>
      <text x="1216" y="712" fill="#6d6d6d">TRAINING</text>
      <text x="1424" y="712" fill="#6d6d6d">SAMPLING</text>
    </g>

    <g font-size="16" letter-spacing="2.5">
      <text x="160" y="912" fill="#6d6d6d">SHIPPED: tokenizer.py - dataset.py</text>
      <text x="1440" y="912" fill="#6d6d6d" text-anchor="end">Python 3.14 - PyTorch - CUDA ready</text>
    </g>
  </g>
</svg>
