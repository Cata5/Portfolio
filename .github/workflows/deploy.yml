name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Force the runner to use Node 24 for all Javascript-based actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Job-wide so the flag reaches the build (and any subprocess it spawns) and
  # the verify step can echo it back as a check.
  NEXT_DEPLOY_TARGET: gh-pages
  NEXT_PUBLIC_DEPLOY_TARGET: gh-pages
  NEXT_PUBLIC_BASE_PATH: /Portofolio-V2
  NEXT_PUBLIC_GOOGLE_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxVQP7DtOk4uj0j13DR-_UzKSSQJksNFslVDo__TYsE5mp2hUQPeab-dM22i1wEFCEXZQ/exec"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # Updated to v6

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6 # Updated to v6
        with:
          node-version: "24" # Now using Node 24
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # NOTE: no .next/cache restore on purpose. The export config is driven by
      # NEXT_PUBLIC_DEPLOY_TARGET (not part of any cache key), and a restored
      # Turbopack build cache has produced exports without the expected config
      # in CI. Cold, deterministic builds are ~1 min slower but always correct.

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      # This site is fully static (no app/api or app/admin routes to strip) —
      # next.config.ts switches to `output: "export"` when the flag below is set.
      # The flag is defined at the job level (see top-level `env`), so it is
      # inherited by the build and every process it spawns.

      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      - name: Ensure static export output exists
        run: test -d out

      # GitHub Pages must not run Jekyll over the export (it would ignore the
      # `_next/` folder), so mark the deployment as a plain static site.
      - name: Add .nojekyll for Pages
        run: touch out/.nojekyll

      # Guard: a static export with the wrong config would silently deploy a
      # broken site (unprefixed assets / flat .html files). Verify the exact
      # things that must be true for this project site to work, and fail the
      # job — with diagnostics — if any are missing.
      - name: Verify export is correctly prefixed
        run: |
          set -e
          echo "NEXT_PUBLIC_DEPLOY_TARGET=$NEXT_PUBLIC_DEPLOY_TARGET"
          fail() { echo "::error::$1"; exit 1; }
          dump() {
            echo "--- out/ html files ---"
            find out -name '*.html' 2>/dev/null | head -30 || true
            echo "--- out/projects/ ---"
            ls out/projects/ 2>/dev/null | head -25 || true
            echo "--- flat html (depth>=2, should be none) ---"
            find out -mindepth 2 -name '*.html' -not -name 'index.html' 2>/dev/null | head -10 || true
          }
          # basePath must prefix assets
          grep -q '/Portofolio-V2/_next' out/index.html \
            || { echo "::error::basePath not applied (no /Portofolio-V2/_next in out/index.html)"; dump; exit 1; }
          # trailingSlash: export must never emit flat <route>.html files
          FLAT=$(find out -mindepth 2 -name '*.html' -not -name 'index.html' | head -1)
          if [ -n "$FLAT" ]; then
            echo "::error::trailingSlash not applied - flat .html file found: $FLAT"
            dump
            exit 1
          fi
          test -f out/projects/vortex/index.html \
            || { echo "::error::missing out/projects/vortex/index.html"; dump; exit 1; }
          # custom image loader must prefix project images on both pages
          grep -q '/Portofolio-V2/projects/' out/index.html \
            || { echo "::error::image loader not applied (no prefixed project image in out/index.html)"; dump; exit 1; }
          grep -q '/Portofolio-V2/projects/' out/projects/vortex/index.html \
            || { echo "::error::image loader not applied on project page"; dump; exit 1; }
          if grep -oE '(href|src)="/projects/' out/index.html; then
            echo "::error::unprefixed internal URLs found (see above)"
            exit 1
          fi
          # The production nav must never ship empty again — a CMS save once
          # stripped navLabel from content/sections.json and the deployed site
          # had zero nav links (desktop nav + mobile drawer both derive from it).
          NAV_LINKS=$(grep -oE 'aria-label="Main navigation"[^>]*>' out/index.html >/dev/null && grep -c 'href="#about"' out/index.html || true)
          if [ "${NAV_LINKS:-0}" -lt 1 ]; then
            echo "::error::homepage nav is empty — no href=\"#about\" link found in the exported header"
            dump
            exit 1
          fi
          # The RAG status export must not leak build-machine config/keys.
          if [ -f out/api/rag/status ]; then
            if grep -q 'apiKey' out/api/rag/status; then
              echo "::error::out/api/rag/status contains an apiKey — the RAG status stub failed"
              exit 1
            fi
          fi
          echo "export verified: basePath + trailingSlash + image loader + nav + api stubs all applied"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
