name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Force the runner to use Node 24 for all Javascript-based actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # Updated to v6

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6 # Updated to v6
        with:
          node-version: "24" # Now using Node 24
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Restore cache
        uses: actions/cache@v5 # Updated to v5 (Node 24 native)
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      # This site is fully static (no app/api or app/admin routes to strip) —
      # next.config.ts switches to `output: "export"` when the flag below is set.

      - name: Build with Next.js
        env:
          NEXT_DEPLOY_TARGET: gh-pages
          NEXT_PUBLIC_DEPLOY_TARGET: gh-pages
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      - name: Ensure static export output exists
        run: test -d out

      # GitHub Pages must not run Jekyll over the export (it would ignore the
      # `_next/` folder), so mark the deployment as a plain static site.
      - name: Add .nojekyll for Pages
        run: touch out/.nojekyll

      # Guard: a static export with the wrong config would silently deploy a
      # broken site (unprefixed assets / flat .html files). Verify the exact
      # things that must be true for this project site to work, and fail the
      # job — with diagnostics — if any are missing.
      - name: Verify export is correctly prefixed
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          grep -q '/Portofolio-V2/_next' out/index.html \
            || fail "basePath not applied to assets (no /Portofolio-V2/_next in out/index.html)"
          test -f out/projects/vortex/index.html \
            || fail "trailingSlash not applied (expected out/projects/vortex/index.html)"
          grep -q '/Portofolio-V2/projects/' out/index.html \
            || fail "image loader not applied (no prefixed project image in out/index.html)"
          grep -q '/Portofolio-V2/projects/' out/projects/vortex/index.html \
            || fail "image loader not applied on project page (out/projects/vortex/index.html)"
          if grep -oE '(href|src)="/projects/' out/index.html; then
            echo "::error::unprefixed internal URLs found (see above)"
            exit 1
          fi
          echo "export verified: basePath + trailingSlash + image loader all applied"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
